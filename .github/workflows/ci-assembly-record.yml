name: Assembly record schema CI

on:
  pull_request:
    paths:
      - 'ffi/schema/**'
      - 'tools/schema/**'
      - 'platforms/web/client/core/core/engine/web-worker/**'
      - 'ffi/rust/tiqian/src/**'
      - '.github/workflows/ci-assembly-record.yml'
  push:
    branches: [main]
    paths:
      - 'ffi/schema/**'
      - 'tools/schema/**'
      - 'platforms/web/client/core/core/engine/web-worker/**'
      - 'ffi/rust/tiqian/src/**'
      - '.github/workflows/ci-assembly-record.yml'
  workflow_dispatch:

concurrency:
  group: ci-assembly-record-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    name: Schema generation freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check TypeScript schema freshness
        run: python3 tools/schema/generate_ts.py --check
      - name: Check Rust schema freshness
        run: python3 tools/schema/generate_rust.py --check
