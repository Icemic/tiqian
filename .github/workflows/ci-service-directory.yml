name: Service directory CI

# ADR 0053 (Web prose host consolidation) `ServiceDirectoryRule`: page-single
# runtime state lives in core/services/ or carries an exemption naming the
# disposition that will delete it. tools/service-directory/check.ts turns
# the rule into a mechanical gate after the 2026-08-25 S-wave audit found
# adjudicated registry moves that were never executed; the gate also fails
# on stale exemptions so a sweeping wave must shrink the table in the same
# commit.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'tools/service-directory/**'
      - '.github/workflows/ci-service-directory.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'tools/service-directory/**'
      - '.github/workflows/ci-service-directory.yml'
  workflow_dispatch:

concurrency:
  group: ci-service-directory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service-directory:
    name: ADR 0053 ServiceDirectoryRule gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      # tools/service-directory/check.ts uses node: builtins only, so there is
      # deliberately no npm install step.
      - name: Run service directory check
        run: node tools/service-directory/check.ts
