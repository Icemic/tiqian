name: TS discipline CI

on:
  pull_request:
    paths:
      - 'platforms/web/client/web-component/**'
      - 'platforms/web/client/core/**'
      - 'ffi/js/npm/**'
      - 'tools/ts-discipline/**'
      - '.github/workflows/ci-ts-discipline.yml'
  push:
    branches: [main]
    paths:
      - 'platforms/web/client/web-component/**'
      - 'platforms/web/client/core/**'
      - 'ffi/js/npm/**'
      - 'tools/ts-discipline/**'
      - '.github/workflows/ci-ts-discipline.yml'
  workflow_dispatch:

concurrency:
  group: ci-ts-discipline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: TS discipline lint and grep check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install linter dependencies
        working-directory: tools/ts-discipline
        run: npm ci
      - name: Run ESLint across packages
        run: npx --prefix tools/ts-discipline eslint --config tools/ts-discipline/eslint.config.ts .
      - name: Verify zero eslint-disable directives
        run: |
          ! grep -rn "eslint-disable" platforms/web/client/web-component platforms/web/client/core ffi/js/npm \
            --include="*.js" --include="*.mjs" --include="*.ts" \
            --exclude-dir=node_modules --exclude-dir=runtime
      # eslint's TS-syntax rules cannot see JSDoc type annotations in plain
      # JS files, so the zero-`any` policy is locked by grep here: any `any`
      # inside a braced type (`{any}`, `{any[]}`, `{Array<any>}`) or in
      # annotation position is a failure.
      - name: Verify zero any types including JSDoc
        run: |
          ! grep -rnE '\{[^}]*\bany\b[^}]*\}|: any\b|any\[\]' platforms/web/client/web-component platforms/web/client/core ffi/js/npm \
            --include="*.js" --include="*.mjs" --include="*.ts" \
            --exclude-dir=node_modules --exclude-dir=runtime
