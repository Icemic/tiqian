name: Boundary check CI

# ADR 0053 (Web prose host consolidation), "ffi boundary review record
# (2026-08-25)": the boundary rulings are enforced as a mechanical gate.
# tools/boundary-check/check.mjs fails CI when engine/, ffi/, frontend/ or
# platforms/ reintroduce what a corrective wave must delete (environment
# globals in engine, wire-format naming in engine commonMain, font session
# state in ffi, unreviewed export entries, separator escape literals outside
# the declared codec modules) without an explicit, task-tagged exemption.

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'ffi/**'
      - 'frontend/**'
      - 'platforms/**'
      - 'tools/boundary-check/**'
      - '.github/workflows/ci-boundary-check.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'ffi/**'
      - 'frontend/**'
      - 'platforms/**'
      - 'tools/boundary-check/**'
      - '.github/workflows/ci-boundary-check.yml'
  workflow_dispatch:

concurrency:
  group: ci-boundary-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundary:
    name: ADR 0053 ffi boundary rulings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      # tools/boundary-check/check.mjs uses node: builtins only, so there is
      # deliberately no npm install step.
      - name: Run boundary check
        run: node tools/boundary-check/check.mjs
