name: Package topology CI

# ADR 0053 (Web prose host consolidation), Verification 8: the three-package
# topology has a CI check. Inter-package dependency direction must be
# web-component -> core -> ffi (@tiqian/prose -> @tiqian/prose-core,
# @tiqian/prose -> @tiqian/ffi, @tiqian/prose-core -> @tiqian/ffi); any other
# @tiqian/* dependency edge and any cross-package relative import fails CI.
# The eslint/grep half of Verification 8 lives in ci-ts-discipline.yml.

on:
  pull_request:
    paths:
      - 'frontend/web/npm/**'
      - 'frontend/web/npm-core/**'
      - 'ffi/js/npm/**'
      - 'tools/package-topology/**'
      - '.github/workflows/ci-package-topology.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/web/npm/**'
      - 'frontend/web/npm-core/**'
      - 'ffi/js/npm/**'
      - 'tools/package-topology/**'
      - '.github/workflows/ci-package-topology.yml'
  workflow_dispatch:

concurrency:
  group: ci-package-topology-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  topology:
    name: Three-package topology check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      # tools/package-topology/check.mjs uses node: builtins only, so there is
      # deliberately no npm install step.
      - name: Run package topology check
        run: node tools/package-topology/check.mjs
